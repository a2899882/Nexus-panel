name: Build panel
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Check management scripts
        run: |
          bash -n panel_install.sh scripts/mb.sh scripts/legacy_cleanup.sh
          python3 -m py_compile scripts/*.py
      - name: Check Debian 12 docker-compose v1 deployment config
        run: |
          docker run --rm -v "$PWD:/src:ro" -w /src \
            -e DB_NAME=ci -e DB_USER=ci -e DB_PASSWORD=ci -e JWT_SECRET=ci \
            debian:12-slim sh -ec 'apt-get update -qq && apt-get install -y -qq docker-compose >/dev/null && docker-compose -f compose.yml config >/dev/null'
      - name: Build deployment images
        env:
          DB_NAME: ci
          DB_USER: ci
          DB_PASSWORD: ci
          JWT_SECRET: ci
        run: |
          docker compose -f compose.yml build backend
          docker compose -f compose.yml build frontend
      - name: Smoke test running panel
        env:
          DB_NAME: ci
          DB_USER: ci
          DB_PASSWORD: ci
          JWT_SECRET: ci
        run: |
          install -d -m 0700 runtime
          NEXUS_ADMIN_USER=ci_admin NEXUS_ADMIN_PASSWORD=CI-Only-Test-Password-1234 NEXUS_BACKEND_ADDRESS=127.0.0.1:6365 \
            python3 scripts/render_sql.py gost.sql runtime/init.sql
          docker compose -f compose.yml up -d --no-build
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:6365/flow/test | grep -qx test && \
               curl -fsS http://127.0.0.1:6366/ | grep -q Nexus-panel && \
               curl -fsS -H 'Content-Type: application/json' -d '{"name":"app_name"}' \
                 http://127.0.0.1:6366/api/v1/config/get | grep -q Nexus-panel && \
               docker compose -f compose.yml exec -T mysql sh -c \
                 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" -N -e "SELECT user FROM user WHERE id=1"' | grep -qx ci_admin; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f compose.yml logs --tail=150 mysql backend frontend
          exit 1
      - name: Publish public prebuilt images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          docker save nexus-panel/backend:local nexus-panel/frontend:local | gzip -1 > panel-images.tar.gz
          sha256sum panel-images.tar.gz > panel-images.sha256
          tag="build-${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" panel-images.tar.gz panel-images.sha256 --clobber
          else
            gh release create "$tag" panel-images.tar.gz panel-images.sha256 \
              --target "$GITHUB_SHA" --title "Nexus-panel images ${GITHUB_SHA}" \
              --notes "Prebuilt backend and frontend images for this source commit." --latest=false
          fi
          curl -fsSL --retry 3 "https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/panel-images.sha256" -o /tmp/panel-images-published.sha256
          cmp panel-images.sha256 /tmp/panel-images-published.sha256
      - name: Stop smoke test containers
        if: always()
        env:
          DB_NAME: ci
          DB_USER: ci
          DB_PASSWORD: ci
          JWT_SECRET: ci
        run: docker compose -f compose.yml down -v
