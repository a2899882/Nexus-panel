name: Build panel
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check management scripts
        run: |
          bash -n panel_install.sh scripts/mb.sh scripts/legacy_cleanup.sh
          python3 -m py_compile scripts/*.py
      - name: Build frontend
        working-directory: vite-frontend
        run: npm install --legacy-peer-deps && npm run build
      - name: Build backend
        working-directory: springboot-backend
        run: mvn -B -DskipTests package
      - name: Build deployment images
        env:
          DB_NAME: ci
          DB_USER: ci
          DB_PASSWORD: ci
          JWT_SECRET: ci
        run: docker compose -f compose.yml build backend frontend
      - name: Smoke test running panel
        env:
          DB_NAME: ci
          DB_USER: ci
          DB_PASSWORD: ci
          JWT_SECRET: ci
        run: |
          install -d -m 0700 runtime
          NEXUS_ADMIN_USER=ci_admin NEXUS_ADMIN_PASSWORD=CI-Only-Test-Password-1234 NEXUS_BACKEND_ADDRESS=127.0.0.1:6365 \
            python3 scripts/render_sql.py gost.sql runtime/init.sql
          docker compose -f compose.yml up -d --no-build
          for attempt in {1..60}; do
            if curl -fsS http://127.0.0.1:6365/flow/test | grep -qx test && \
               curl -fsS http://127.0.0.1:6366/ | grep -q Nexus-panel && \
               curl -fsS -H 'Content-Type: application/json' -d '{"name":"app_name"}' \
                 http://127.0.0.1:6366/api/v1/config/get | grep -q Nexus-panel && \
               docker compose -f compose.yml exec -T mysql sh -c \
                 'mysql -uroot -p"$MYSQL_ROOT_PASSWORD" "$MYSQL_DATABASE" -N -e "SELECT user FROM user WHERE id=1"' | grep -qx ci_admin; then
              exit 0
            fi
            sleep 5
          done
          docker compose -f compose.yml logs --tail=150 mysql backend frontend
          exit 1
      - name: Stop smoke test containers
        if: always()
        env:
          DB_NAME: ci
          DB_USER: ci
          DB_PASSWORD: ci
          JWT_SECRET: ci
        run: docker compose -f compose.yml down -v
