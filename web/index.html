<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#4f6ef7"><title>Nexus-panel</title><link rel="stylesheet" href="/styles.css"></head>
<body><div id="login" class="login-shell hidden"><main class="login-main"><div class="login-card"><div class="brand"><span class="brand-mark">N</span><span><b>Nexus-panel</b><small>NETWORK CONTROL</small></span></div><div class="login-copy"><p class="eyebrow">WELCOME BACK</p><h1>欢迎回来</h1><p class="muted">登录管理控制台，查看线路与服务状态。</p></div><form id="login-form" class="login-form"><label>管理员账号<input name="username" autocomplete="username" required autofocus></label><label>密码<input type="password" name="password" autocomplete="current-password" required></label><button class="primary full large">登录控制台</button><p id="login-error" class="error-text"></p></form><p class="login-footnote">Nexus-panel · 安全连接</p></div></main><aside class="login-visual"><div class="orb orb-one"></div><div class="orb orb-two"></div><div class="visual-copy"><span class="visual-badge">REALM RELAY CONTROL</span><h2>让每一条连接<br>都清晰可控。</h2><p>轻量转发管理。统一管理服务器、端口规则与运行状态。</p></div><div class="visual-card"><span class="pulse"></span><div><b>集中控制 · 分布运行</b><small>配置由节点主动拉取，链路一目了然</small></div></div></aside></div>
<div id="app" class="app-shell hidden"><aside class="sidebar"><div class="sidebar-brand brand"><span class="brand-mark">N</span><span><b>Nexus-panel</b><small>RELAY CONTROL</small></span></div><p class="nav-caption">工作台</p><nav id="nav"><button data-page="overview" class="active"><span class="nav-icon">▦</span>总览</button><button data-page="forwardings"><span class="nav-icon">⇄</span>转发管理</button><button data-page="tunnels"><span class="nav-icon">⤳</span>隧道管理</button><button data-page="nodes"><span class="nav-icon">▤</span>节点监控</button><button data-page="accounts"><span class="nav-icon">◫</span>账号与配额</button><button data-page="rules"><span class="nav-icon">◇</span>Realm 直连</button><button data-page="diagnostic"><span class="nav-icon">◌</span>连通诊断</button><button data-page="events"><span class="nav-icon">◷</span>操作记录</button><button data-page="settings"><span class="nav-icon">⚙</span>设置</button></nav><div class="sidebar-foot"><span><i class="live-dot"></i> 控制台运行中</span><button id="logout" class="text-button">退出</button></div></aside><div id="scrim" class="scrim hidden"></div><main class="main-shell"><header class="topbar"><div class="top-title"><button id="mobile-menu" class="mobile-menu">☰</button><div><span class="eyebrow" id="breadcrumb">WORKSPACE / OVERVIEW</span><h1 id="title">总览</h1></div></div><div class="top-actions"><span id="sync-time" class="muted small"></span><button id="refresh" title="刷新状态">↻ 刷新</button><span id="username" class="user-chip"></span></div></header><div id="content" class="content"></div></main></div>
<div id="modal" class="modal-wrap hidden"><div class="modal-backdrop" data-close="1"></div><div class="dialog" role="dialog" aria-modal="true"><div class="dialog-head"><div><p class="eyebrow">NEXUS-PANEL</p><h2 id="modal-title"></h2></div><button class="icon-button" data-close="1" aria-label="关闭">×</button></div><div id="modal-body"></div></div></div><div id="toast" class="toast hidden"></div><script defer src="/app.js"></script></body></html>
